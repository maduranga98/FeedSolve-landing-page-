    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const loading = document.getElementById("__bundler_loading");
        function setStatus(msg) {
          if (loading) loading.textContent = msg;
        }

        // Error sink persists across replaceWith since it's on window, not the DOM.
        window.addEventListener(
          "error",
          function (e) {
            var p = document.body || document.documentElement;
            var d =
              document.getElementById("__bundler_err") ||
              p.appendChild(document.createElement("div"));
            d.id = "__bundler_err";
            d.style.cssText =
              "position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto";
            d.textContent =
              (d.textContent ? d.textContent + String.fromCharCode(10) : "") +
              "[bundle] " +
              (e.message || e.type) +
              (e.filename
                ? " (" + e.filename.slice(0, 60) + ":" + e.lineno + ")"
                : "");
          },
          true,
        );

        try {
          const manifestEl = document.querySelector(
            'script[type="__bundler/manifest"]',
          );
          const templateEl = document.querySelector(
            'script[type="__bundler/template"]',
          );
          if (!manifestEl || !templateEl) {
            setStatus("Error: missing bundle data");
            console.error(
              "[bundler] Missing script tags — manifestEl:",
              !!manifestEl,
              "templateEl:",
              !!templateEl,
            );
            return;
          }

          const manifest = JSON.parse(manifestEl.textContent);
          let template = JSON.parse(templateEl.textContent);

          const uuids = Object.keys(manifest);
          setStatus("Unpacking " + uuids.length + " assets...");

          const blobUrls = {};
          await Promise.all(
            uuids.map(async (uuid) => {
              const entry = manifest[uuid];
              try {
                const binaryStr = atob(entry.data);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++)
                  bytes[i] = binaryStr.charCodeAt(i);

                let finalBytes = bytes;
                if (entry.compressed) {
                  if (typeof DecompressionStream !== "undefined") {
                    const ds = new DecompressionStream("gzip");
                    const writer = ds.writable.getWriter();
                    const reader = ds.readable.getReader();
                    writer.write(bytes);
                    writer.close();
                    const chunks = [];
                    let totalLen = 0;
                    while (true) {
                      const { done, value } = await reader.read();
                      if (done) break;
                      chunks.push(value);
                      totalLen += value.length;
                    }
                    finalBytes = new Uint8Array(totalLen);
                    let offset = 0;
                    for (const chunk of chunks) {
                      finalBytes.set(chunk, offset);
                      offset += chunk.length;
                    }
                  } else {
                    console.warn(
                      "DecompressionStream not available, asset " +
                        uuid +
                        " may not render",
                    );
                  }
                }

                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([finalBytes], { type: entry.mime }),
                );
              } catch (err) {
                console.error("Failed to decode asset " + uuid + ":", err);
                blobUrls[uuid] = URL.createObjectURL(
                  new Blob([], { type: entry.mime }),
                );
              }
            }),
          );

          const extResEl = document.querySelector(
            'script[type="__bundler/ext_resources"]',
          );
          const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
          const resourceMap = {};
          for (const entry of extResources) {
            if (blobUrls[entry.uuid])
              resourceMap[entry.id] = blobUrls[entry.uuid];
          }

          setStatus("Rendering...");
          for (const uuid of uuids)
            template = template.split(uuid).join(blobUrls[uuid]);

          // Strip integrity + crossorigin — blob URLs from a file:// document inherit
          // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
          // The manifest bytes are ours; SRI protects against CDN compromise, not this.
          template = template
            .replace(/\s+integrity="[^"]*"/gi, "")
            .replace(/\s+crossorigin="[^"]*"/gi, "");

          const resourceScript =
            "<script>window.__resources = " +
            JSON.stringify(resourceMap)
              .split("</" + "script>")
              .join("<\\/" + "script>") +
            ";</" +
            "script>";
          // Inject after <head> so the DOCTYPE stays first; prepending the script
          // would push the parser into quirks mode. DOMParser always emits a <head>
          // (synthesizing one if the source HTML omitted it) but may carry
          // attributes through, so match the full opening tag. slice() rather than
          // replace() keeps us clear of $-pattern substitution in resourceScript.
          const headOpen = template.match(/<head[^>]*>/i);
          if (headOpen) {
            const i = headOpen.index + headOpen[0].length;
            template =
              template.slice(0, i) + resourceScript + template.slice(i);
          }

          // Parse the template and swap the root element. Scripts inserted via
          // DOMParser/replaceWith are inert per spec — re-create each with
          // createElement so they execute, awaiting onload for src scripts to
          // preserve ordering (React before ReactDOM before Babel before text/babel).
          const doc = new DOMParser().parseFromString(template, "text/html");
          document.documentElement.replaceWith(doc.documentElement);
          const dead = Array.from(document.scripts);
          for (const old of dead) {
            const s = document.createElement("script");
            for (const a of old.attributes) s.setAttribute(a.name, a.value);
            s.textContent = old.textContent;
            // text/babel scripts with a src: fetch and inline. transformScriptTags
            // does XHR against the src, but blob:null/ from a file:// origin is
            // silently dropped. Inlining makes it a plain inline babel script,
            // which transformScriptTags handles unconditionally.
            if ((s.type === "text/babel" || s.type === "text/jsx") && s.src) {
              const r = await fetch(s.src);
              s.textContent = await r.text();
              s.removeAttribute("src");
            }
            const p = s.src
              ? new Promise(function (r) {
                  s.onload = s.onerror = r;
                })
              : null;
            old.replaceWith(s);
            if (p) await p;
          }
          // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
          // which fired before we swapped the document. Trigger manually if present.
          if (
            window.Babel &&
            typeof window.Babel.transformScriptTags === "function"
          ) {
            window.Babel.transformScriptTags();
          }
        } catch (err) {
          setStatus("Error unpacking: " + err.message);
          console.error("Bundle unpack error:", err);
        }
      });
    </script>

r-bottom-color: var(--border); box-shadow: 0 2px 20px rgba(30,53,87,0.09); }\n.nav-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; height: 64px; }\n.nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; flex-shrink: 0; }\n.nav-logo img { height: 34px; width: 34px; object-fit: contain; }\n.nav-logo-text { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--navy); letter-spacing: -0.3px; white-space: nowrap; }\n.nav-links { display: flex; align-items: center; gap: 32px; list-style: none; }\n.nav-links a { font-size: 15px; font-weight: 500; color: var(--text-mid); text-decoration: none; transition: color var(--t); white-space: nowrap; }\n.nav-links a:hover { color: var(--navy); }\n.nav-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }\n.btn-ghost { font-family: var(--font-body); font-size: 15px; font-weight: 500; color: var(--navy); background: transparent; border: none; cursor: pointer; padding: 8px 14px; border-radius: 8px; transition: background var(--t); text-decoration: none; white-space: nowrap; }\n.btn-ghost:hover { background: var(--teal-pale); }\n.btn-primary { font-family: var(--font-body); font-size: 15px; font-weight: 600; background: var(--navy); color: var(--white); border: none; cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: background var(--t), transform var(--t), box-shadow var(--t); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }\n/* Hamburger */\n.nav-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 8px; border: none; background: none; }\n.nav-hamburger span { display: block; width: 22px; height: 2px; background: var(--navy); border-radius: 2px; transition: all 0.25s ease; }\n.nav-hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }\n.nav-hamburger.open span:nth-child(2) { opacity: 0; }\n.nav-hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }\n/* Mobile menu */\n.mobile-menu { display: none; position: fixed; top: 64px; left: 0; right: 0; background: var(--white); border-bottom: 1px solid var(--border); box-shadow: 0 8px 32px rgba(30,53,87,0.1); z-index: 99; padding: 20px 24px; flex-direction: column; gap: 4px; }\n.mobile-menu.open { display: flex; }\n.mobile-menu a { font-size: 16px; font-weight: 500; color: var(--text); text-decoration: none; padding: 12px 8px; border-bottom: 1px solid var(--border); transition: color var(--t); }\n.mobile-menu a:last-child { border-bottom: none; margin-top: 8px; }\n.mobile-menu a:hover { color: var(--teal); }\n.mobile-menu .mobile-cta { background: var(--teal); color: white; text-align: center; border-radius: 8px; padding: 14px; font-weight: 600; border-bottom: none; }\n.btn-primary:hover { background: var(--navy-deep); transform: translateY(-1px); box-shadow: 0 6px 20px rgba(30,53,87,0.25); }\n.btn-primary.teal { background: var(--teal); }\n.btn-primary.teal:hover { background: var(--teal-light); box-shadow: 0 6px 20px rgba(58,143,165,0.35); }\n.btn-outline { font-family: var(--font-body); font-size: 15px; font-weight: 600; background: transparent; color: var(--navy); border: 1.5px solid var(--navy); cursor: pointer; padding: 10px 20px; border-radius: 8px; transition: all var(--t); text-decoration: none; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }\n.btn-outline:hover { background: var(--navy); color: white; }\n\n/* SECTION SHARED */\nsection { padding: 96px 32px; }\n.container { max-width: 1200px; margin: 0 auto; }\n.section-label { display: inline-flex; align-items: center; gap: 8px; background: var(--teal-pale); color: var(--teal); font-size: 12px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; padding: 5px 14px; border-radius: 100px; margin-bottom: 20px; }\n.section-label svg { width: 13px; height =\"height:6px;background:#16A34A\"><\u002Fdiv>\n        <div style=\"padding:24px;flex:1;display:flex;flex-direction:column;gap:12px\">\n          <div style=\"display:inline-flex;align-items:center;background:#F0FDF4;color:#16A34A;font-size:11px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;padding:4px 10px;border-radius:100px;align-self:flex-start\">Case Study<\u002Fdiv>\n          <h3 style=\"font-family:var(--font-display);font-size:17px;font-weight:700;color:var(--navy);line-height:1.3;letter-spacing:-0.02em\">How Zest Foods reduced customer complaints by 68% in 90 days<\u002Fh3>\n          <p style=\"font-size:14px;color:var(--text-mid);line-height:1.65;flex:1\">A real story from food manufacturing to quality control transformation.<\u002Fp>\n          <div style=\"display:flex;align-items:center;gap:9px;padding-top:12px;border-top:1px solid var(--border)\">\n            <div style=\"width:26px;height:26px;border-radius:50%;background:#16A34A;display:flex;align-items:center;justify-content:center;color:white;font-size:10px;font-weight:700;flex-shrink:0\">TR<\u002Fdiv>\n            <div style=\"font-size:12px;color:var(--text-light)\">Team FeedSolve · 6 min<\u002Fdiv>\n            <span style=\"margin-left:auto;display:flex;align-items:center;gap:4px;font-size:13px;font-weight:600;color:var(--teal)\">Read <i data-lucide=\"arrow-right\" style=\"width:13px;height:13px\"><\u002Fi><\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fa>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FINAL CTA -->\n<section id=\"cta-final\">\n <div class=\"cta-glow\"><\u002Fdiv>\n <div class=\"container\">\n <h2>Your first resolved issue<br>is 2 minutes away.<\u002Fh2>\n <p>Start collecting and resolving feedback today.<\u002Fp>\n <div class=\"cta-btns\">\n <a href=\"#\" class=\"btn-primary teal\">Try Now It's Free <i data-lucide=\"arrow-right\"><\u002Fi><\u002Fa>\n <\u002Fdiv>\n <div class=\"cta-trust-line\"><i data-lucide=\"lock\"><\u002Fi> No credit card required<\u002Fdiv>\n <\u002Fdiv>\n<\u002Fsection>\n\n<!-- FOOTER -->\n<footer>\n <div class=\"footer-inner\">\n <div class=\"footer-logo\">\n <img src=\"4d7b41de-25fe-43eb-b0c1-5595de627d93\" alt=\"FeedSolve\">\n <span class=\"footer-logo-text\">FeedSolve<\u002Fspan>\n <\u002Fdiv>\n <div class=\"footer-links\">\n <a href=\"#solution\">Product<\u002Fa>\n <a href=\"#pricing\">Pricing<\u002Fa>\n <a href=\"#\">Contact<\u002Fa>\n <a href=\"#\">Privacy Policy<\u002Fa>\n <a href=\"#\">Terms<\u002Fa>\n <\u002Fdiv>\n <\u002Fdiv>\n <div class=\"footer-copy\">© 2026 FeedSolve. All rights reserved. &nbsp;·&nbsp; A product of <strong style=\"color:rgba(255,255,255,0.45);font-weight:600\">Lumora Ventures Pvt. Ltd.<\u002Fstrong><\u002Fdiv>\n<\u002Ffooter>\n\n<!-- TWEAKS PANEL -->\n<div id=\"tweaks-panel\">\n <h4>Tweaks<\u002Fh4>\n <div class=\"tw-row\">\n <div class=\"tw-label\">Accent Color<\u002Fdiv>\n <div class=\"tw-opts\">\n <div class=\"tw-swatch active\" style=\"background:#3A8FA5\" onclick=\"setAccent('#3A8FA5','#4FAAC2','#E8F4F8',this)\"><\u002Fdiv>\n <div class=\"tw-swatch\" style=\"background:#5B7FC0\" onclick=\"setAccent('#5B7FC0','#7096D4','#EEF2FF',this)\"><\u002Fdiv>\n <div class=\"tw-swatch\" style=\"background:#5A9E6F\" onclick=\"setAccent('#5A9E6F','#6EB882','#EEFAF3',this)\"><\u002Fdiv>\n <div class=\"tw-swatch\" style=\"background:#C4704B\" onclick=\"setAccent('#C4704B','#D98563','#FFF3E0',this)\"><\u002Fdiv>\n <\u002Fdiv>\n <\u002Fdiv>\n <div class=\"tw-row\">\n <div class=\"tw-label\">Hero Layout<\u002Fdiv>\n <div class=\"tw-opts\">\n <button class=\"tw-btn active\" onclick=\"setHero('split',this)\">Split<\u002Fbutton>\n <button class=\"tw-btn\" onclick=\"setHero('centered',this)\">Centered<\u002Fbutton>\n <\u002Fdiv>\n <\u002Fdiv>\n <div class=\"tw-row\">\n <div class=\"tw-label\">Navbar<\u002Fdiv>\n <div class=\"tw-opts\">\n <button class=\"tw-btn active\" onclick=\"setNav('light',this)\">Light<\u002Fbutton>\n <button class=\"tw-btn\" onclick=\"setNav('dark',this)\">Dark<\u002Fbutton>\n <\u002Fdiv>\n <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\nconst TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{\"accent\":\"#3A8FA5\",\"accentLight\":\"#4FAAC2\",\"accentPale\":\"#E8F4F8\",\"heroStyle\":\"split\",\"navStyle\":\"light\"}/*EDITMODE-END*/;\n\n// ── Init Lucide icons\nlucide.createIcons();\n\n// ── Nav scroll\nwindow.addEventListener('scroll', () => {\n document.getElementById('navbar').classList.toggle('scrolled', window.scrollY > 10);\n});\n\n// ── Hamburger menu\nconst hamburger = document.getElementById('hamburger');\nconst mobileMenu = document.getElementById('mobile-menu');\nhamburger.addEventListener('click', () => {\n hamburger.classList.toggle('open');\n mobileMenu.classList.toggle('open');\n});\nfunction closeMobileMenu() {\n hamburger.classList.remove('open');\n mobileMenu.classList.remove('open');\n}\n// Close on scroll\nwindow.addEventListener('scroll', () => { closeMobileMenu(); }, { passive: true });\n\n// ── GSAP Animations\ngsap.registerPlugin(ScrollTrigger);\n\n// Hero entrance CSS-driven so it works in all environments\n\n// Floating cards subtle animation\ngsap.to('#float-notif', { y: -8, duration: 2.8, repeat: -1, yoyo: true, ease: 'sine.inOut' });\ngsap.to('#float-qr', { y: 6, duration: 3.2, repeat: -1, yoyo: true, ease: 'sine.inOut', delay: 0.6 });\n\n// Steps section\ngsap.from('.steps-grid .step-card', {\n scrollTrigger: { trigger: '#steps', start: 'top 75%' },\n opacity: 0, y: 40, stagger: 0.15, duration: 0.6, ease: 'power2.out'\n});\ngsap.from('#steps h2', {\n scrollTrigger: { trigger: '#steps', start: 'top 80%' },\n opacity: 0, y: 24, duration: 0.55, ease: 'power2.out'\n});\n\n// Problem points\ngsap.from('.pp', {\n scrollTrigger: { trigger: '#problem', start: 'top 75%' },\n opacity: 0, x: -24, stagger: 0.1, duration: 0.5, ease: 'power2.out'\n});\ngsap.from('.problem-viz', {\n scrollTrigger: { trigger: '#problem', start: 'top 75%' },\n opacity: 0, x: 32, duration: 0.7, ease: 'power2.out', delay: 0.1\n});\ngsap.from('.punch', {\n scrollTrigger: { trigger: '.punch', start: 'top 85%' },\n opacity: 0, y: 16, duration: 0.5, ease: 'power2.out'\n});\n\n// Loop steps\ngsap.from('.loop-step', {\n scrollTrigger: { trigger: '#solution', start: 'top 75%' },\n opacity: 0, y: 36, scale: 0.95, stagger: 0.12, duration: 0.55, ease: 'back.out(1.4)'\n});\ngsap.from('.loop-center-graphic', {\n scrollTrigger: { trigger: '#solution', start: 'top 80%' },\n opacity: 0, scale: 0.7, duration: 0.7, ease: 'back.out(1.5)'\n});\n\n// Use case cards\ngsap.from('.uc-card', {\n scrollTrigger: { trigger: '#usecases', start: 'top 75%' },\n opacity: 0, y: 32, stagger: 0.1, duration: 0.55, ease: 'power2.out'\n});\n\n// Diff\ngsap.from('.diff-left', {\n scrollTrigger: { trigger: '#diff', start: 'top 75%' },\n opacity: 0, x: -32, duration: 0.65, ease: 'power2.out'\n});\ngsap.from('.diff-table', {\n scrollTrigger: { trigger: '#diff', start: 'top 75%' },\n opacity: 0, x: 32, duration: 0.65, ease: 'power2.out', delay: 0.1\n});\n\n// Before/After\ngsap.from('.ba-card.before', {\n scrollTrigger: { trigger: '#before-after', start: 'top 78%' },\n opacity: 0, x: -28, duration: 0.6, ease: 'power2.out'\n});\ngsap.from('.ba-card.after', {\n scrollTrigger: { trigger: '#before-after', start: 'top 78%' },\n opacity: 0, x: 28, duration: 0.6, ease: 'power2.out', delay: 0.12\n});\n\n// Pricing cards\ngsap.from('.pc', {\n scrollTrigger: { trigger: '#pricing', start: 'top 75%' },\n opacity: 0, y: 36, stagger: 0.1, duration: 0.55, ease: 'power2.out'\n});\n\n// Final CTA\ngsap.from('#cta-final h2, #cta-final p, .cta-btns', {\n scrollTrigger: { trigger: '#cta-final', start: 'top 80%' },\n opacity: 0, y: 28, stagger: 0.12, duration: 0.6, ease: 'power2.out'\n});\n\n// Counter animation for hero stats\nfunction animateCounter(el, target, duration = 1200) {\n const start = performance.now();\n const update = (now) => {\n const progress = Math.min((now - start) / duration, 1);\n const eased = 1 - Math.pow(1 - progress, 3);\n el.textContent = Math.round(eased * target);\n if (progress < 1) requestAnimationFrame(update);\n };\n requestAnimationFrame(update);\n}\n\nlet countersStarted = false;\nScrollTrigger.create({\n trigger: '#hero',\n start: 'top 90%',\n onEnter: () => {\n if (!countersStarted) {\n countersStarted = true;\n setTimeout(() => {\n animateCounter(document.getElementById('stat-total'), 48, 1000);\n animateCounter(document.getElementById('stat-resolved'), 41, 1100);\n animateCounter(document.getElementById('stat-open'), 7, 900);\n }, 600);\n }\n }\n});\n\n// Demo button\ndocument.getElementById('demo-btn').addEventListener('click', e => {\n e.preventDefault();\n const t = document.getElementById('demo-tracker');\n const isOpen = t.classList.contains('visible');\n if (!isOpen) {\n t.classList.add('visible');\n gsap.from(t, { opacity: 0, y: 20, duration: 0.45, ease: 'power2.out' });\n gsap.from(t.querySelectorAll('.de'), { opacity: 0, x: -16, stagger: 0.12, duration: 0.4, ease: 'power2.out', delay: 0.15 });\n } else {\n t.classList.remove('visible');\n }\n});\n\n// FAQ\nfunction toggleFaq(el) {\n const item = el.parentElement;\n const isOpen = item.classList.contains('open');\n document.querySelectorAll('.faq-item').forEach(i => i.classList.remove('open'));\n if (!isOpen) item.classList.add('open');\n}\n\n// ── TWEAKS\nwindow.addEventListener('message', e => {\n if (e.data?.type === '__activate_edit_mode') document.getElementById('tweaks-panel').classList.add('visible');\n if (e.data?.type === '__deactivate_edit_mode') document.getElementById('tweaks-panel').classList.remove('visible');\n});\nwindow.parent.postMessage({ type: '__edit_mode_available' }, '*');\n\nfunction setAccent(c, l, p, el) {\n document.documentElement.style.setProperty('--teal', c);\n document.documentElement.style.setProperty('--teal-light', l);\n document.documentElement.style.setProperty('--teal-pale', p);\n document.querySelectorAll('.tw-swatch').forEach(s => s.classList.remove('active'));\n el.classList.add('active');\n window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { accent: c, accentLight: l, accentPale: p } }, '*');\n}\n\nfunction setHero(style, el) {\n const inner = document.querySelector('.hero-inner');\n const vis = document.querySelector('.hero-visual');\n if (style === 'centered') {\n inner.style.gridTemplateColumns = '1fr';\n inner.style.textAlign = 'center';\n vis.style.display = 'none';\n document.querySelector('.hero-sub').style.margin = '0 auto 36px';\n document.querySelector('.hero-ctas').style.justifyContent = 'center';\n document.querySelector('.hero-trust').style.justifyContent = 'center';\n } else {\n inner.style.gridTemplateColumns = '1fr 1fr';\n inner.style.textAlign = '';\n vis.style.display = 'block';\n document.querySelector('.hero-sub').style.margin = '';\n document.querySelector('.hero-ctas').style.justifyContent = '';\n document.querySelector('.hero-trust').style.justifyContent = '';\n }\n document.querySelectorAll('.tw-btn').forEach(b => { if (['Split','Centered'].includes(b.textContent)) b.classList.remove('active'); });\n el.classList.add('active');\n window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { heroStyle: style } }, '*');\n}\n\nfunction setNav(style, el) {\n const nav = document.getElementById('navbar');\n if (style === 'dark') {\n nav.style.background = 'var(--navy)';\n nav.style.borderBottomColor = 'rgba(255,255,255,0.08)';\n document.querySelectorAll('.nav-links a').forEach(a => a.style.color = 'rgba(255,255,255,0.65)');\n document.querySelector('.nav-logo-text').style.color = '#fff';\n document.querySelector('.btn-ghost').style.color = '#fff';\n } else {\n nav.style.background = 'rgba(248,247,244,0.92)';\n nav.style.borderBottomColor = '';\n document.querySelectorAll('.nav-links a').forEach(a => a.style.color = '');\n document.querySelector('.nav-logo-text').style.color = '';\n document.querySelector('.btn-ghost').style.color = '';\n }\n document.querySelectorAll('.tw-btn').forEach(b => { if (['Light','Dark'].includes(b.textContent)) b.classList.remove('active'); });\n el.classList.add('active');\n window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { navStyle: style } }, '*');\n}\n\n// Apply saved tweaks\nconst s = TWEAK_DEFAULTS;\nif (s.accent) {\n document.documentElement.style.setProperty('--teal', s.accent);\n document.documentElement.style.setProperty('--teal-light', s.accentLight);\n document.documentElement.style.setProperty('--teal-pale', s.accentPale);\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
    </script>
